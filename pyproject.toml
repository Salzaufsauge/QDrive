[project]
name = "qdrive"
version = "1.0.0"
description = "A wrapper around the reinforcement learning framework Stable-Baselines3"
readme = "README.md"
license = "MIT"
requires-python = "==3.13.*"
dependencies = [
    "stable-baselines3[extra]==2.9.0",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "triton-rocm==3.7.1; sys_platform == 'linux'",
    "pygame",
    "gymnasium[all]>=1.3.0",
    "imageio[ffmpeg]==2.37.4",
    "pyyaml>=6.0.3",
    "polars==1.44.2",
    "pyarrow==25.0.1",
    "wandb==0.28.2",
    "nicegui==3.16.0",
    "pywebview==6.2.1",
    "plotly==7.1.0",
    "rl-zoo3==2.9.1",
    "opencv-python==5.0.0.93",
    "python-dotenv==1.2.4",
    "numpy==2.5.3",
    "fastapi>=0.141.1",
]
authors = [
    { name = "Leon Ueberberg" },
    { name = "David Schneider" },
]

[dependency-groups]
dev = [
    "pytest",
]
lint = [
    "ruff>=0.16.7",
]

[project.optional-dependencies]
sb3-contrib = [
    "sb3-contrib==2.9.0"
]
trackmania = [
    "tmrl==0.7.1",
]

[project.scripts] # could use gui-scripts, but this would require other means of killing the server
qdrive = "main:main"

[build-system]
requires = ["setuptools", "swig"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
no-build-isolation-package = ["box2d-py"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132" },
]
torchvision = [
    { index = "pytorch-cu132" },
]

triton-rocm = [
    { index = "pytorch-cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
