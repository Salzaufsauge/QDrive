[project]
name = "qdrive"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "stable-baselines3[extra]==2.9.0",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "pygame",
    "gymnasium[all]>=1.3.0",
    "imageio[ffmpeg]>=2.37.3",
    "seaborn>=0.13.2",
    "pyyaml>=6.0.3",
    "polars>=1.42.1",
    "pyarrow>=24.0.0",
    "matplotlib>=3.10.9",
    "wandb>=0.28.0",
    "sb3-contrib==2.9.0",
    "nicegui==3.14.0",
    "pywebview==6.2.1",
]

[build-system]
requires = ["setuptools", "swig"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132" },
]
torchvision = [
    { index = "pytorch-cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
