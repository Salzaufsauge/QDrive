[project]
name = "qdrive"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "stable-baselines3[extra]==2.9.0",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "triton-rocm==3.7.1; sys_platform == 'linux'",
    "pygame",
    "gymnasium[all]>=1.3.0",
    "imageio[ffmpeg]==2.37.4",
    "pyyaml>=6.0.3",
    "polars==1.44.1",
    "pyarrow==25.0.1",
    "wandb==0.29.0",
    "sb3-contrib==2.9.0",
    "nicegui==3.16.0",
    "pywebview==6.2.1",
    "plotly==7.0.0",
    "rl-zoo3==2.9.1",
    "opencv-python==5.0.0.93",
    "ruff==0.16.5",
    "tmrl>=0.7.1",
]

[build-system]
requires = ["setuptools", "swig"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132" },
]
torchvision = [
    { index = "pytorch-cu132" },
]

triton-rocm = [
    { index = "pytorch-cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
