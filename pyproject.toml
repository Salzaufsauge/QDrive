[project]
name = "qdrive"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "pyrefly>=0.60.0",
    "stable-baselines3[extra]==2.9.0a2",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "gymnasium[box2d]"
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu132"},
]
torchvision = [
  { index = "pytorch-cu132"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true